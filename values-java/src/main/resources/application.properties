# 应用服务 WEB 访问端口
server.port=8080

# 数据源：只读查询 values 库，连接参数固定时区与字符集，避免中文乱码和时间偏移
spring.datasource.url=jdbc:mysql://localhost:3306/values?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus：XML 放在 resources/mapper 下，实体在 entity 包，列名靠下划线转驼峰映射
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=ming.valuesjava.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 用 Slf4jImpl 而不是 StdOutImpl：SQL 统一走 logback 的滚动文件，避免控制台与文件双写
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# 图片审核清单（CSV）路径。相对路径按进程工作目录（values-java）解析，也支持绝对路径。
# 需要换位置时设置环境变量 APP_IMAGE_MANIFEST_PATH 即可覆盖，不必改配置重新打包。
app.image.manifest-path=../values-python/data/images/food-image-manifest.csv
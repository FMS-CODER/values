# 应用服务 WEB 访问端口
server.port=8080

# 数据源：只读查询 values 库，连接参数固定时区与字符集，避免中文乱码和时间偏移
spring.datasource.url=jdbc:mysql://localhost:3306/values?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver